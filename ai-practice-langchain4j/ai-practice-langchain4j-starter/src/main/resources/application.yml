server:
  port: 8668
  shutdown: graceful

spring:
  application:
    name: qwen-ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

ai:
  session:
    timeout-seconds: 1800
    cleanup-interval-ms: 60000
    max-sessions-per-minute: 10
    max-messages: 20
  chat:
    webull:
      api-key: ${WEBULL_API_KEY}
      api-url: ${WEBULL_API_URL:https://pre-office.webullbroker.com/api/oa-ai/open}
      stream: true
      model: us.deepseek.r1-v1:0
      temperature: 0.7
      max-tokens: 2048
      top_p: 0.9
      thinking_type: enabled #  关闭是disable
      thinking_budget_tokens: 16000
    qwen:
      api-key: ${QWEN_API_KEY}
      api-url: ${QWEN_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
#  langchain4j:
#    api-key: ${QWEN_API_KEY:sk-33b96ae17cba4c928a8bf7bcab5b5b08}
#    model-name: qwen-turbo
#    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1


logging:
  level:
    com.czy.ai.qwen: INFO

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

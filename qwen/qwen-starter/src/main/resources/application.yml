server:
  port: 8668
  shutdown: graceful

spring:
  application:
    name: qwen-ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

ai:
  qwen:
    api-key: ${QWEN_API_KEY:sk-33b96ae17cba4c928a8bf7bcab5b5b08}
    api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    http:
      connect-timeout: 30
      read-timeout: 60
      write-timeout: 60
      stream-read-timeout: 300
    session:
      timeout-seconds: 1800
      cleanup-interval-ms: 60000
      max-sessions-per-minute: 10
      max-messages: 20

logging:
  level:
    com.czy.ai.qwen: INFO

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
